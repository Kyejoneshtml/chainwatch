<!-- @dsCard group="Colors" viewport="700x180" name="Severity" subtitle="Four levels — colour never carries meaning alone" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-sans);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%}
.badge{padding:4px 8px;border-radius:4px;font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:6px}</style>
<div class="row"><span class="badge" style="background:#FEF3F2;color:#B42318"><span class="dot" style="background:#B42318"></span>critical</span><span style="color:var(--text-muted)">#B42318 on #FEF3F2</span></div>
<div class="row"><span class="badge" style="background:#FFFAEB;color:#B54708"><span class="dot" style="background:#B54708"></span>high</span><span style="color:var(--text-muted)">#B54708 on #FFFAEB</span></div>
<div class="row"><span class="badge" style="background:#F7F7F5;color:#5A5A57"><span class="dot" style="border:1.5px solid #5A5A57"></span>medium</span><span style="color:var(--text-muted)">#5A5A57 on #F7F7F5</span></div>
<div class="row"><span class="badge" style="background:#FFFFFF;color:#8A8A85;border:1px solid #E4E4E1"><span class="dot" style="border:1px solid #C9C9C5"></span>low</span><span style="color:var(--text-muted)">#8A8A85 on #FFFFFF</span></div>
