regtest=1
server=1
printtoconsole=1
fallbackfee=0.0002

rpcuser=chainwatch
rpcpassword=regtestonly

# Same two topics the ingestor subscribes to on mainnet (see bitcoin.conf) --
# needed so ingestor/main.py can be run against these nodes at all for
# regtest/ingestor-rollback-test.sh. Both btc1 and btc2 publish (they share
# this file); only btc1's ports are exposed to the host, since that's the
# node the ingestor watches.
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubsequence=tcp://0.0.0.0:28335

[regtest]
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18443
port=18444
