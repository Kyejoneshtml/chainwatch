services:
  bitcoind:
    image: bitcoin/bitcoin:31.1
    container_name: bitcoind
    restart: unless-stopped
    stop_grace_period: 10m
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
      - ./bitcoin.conf:/config/bitcoin.conf:ro
    command: -conf=/config/bitcoin.conf
    ports:
      - "8333:8333"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.30.16
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: chainwatch
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./schema:/docker-entrypoint-initdb.d:ro

volumes:
  bitcoin-data:
  clickhouse-data:


